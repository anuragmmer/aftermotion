<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120d2b">
<title>Aftermotion</title>
<meta name="description" content="A neon puzzle game where echoes copy only the first move of every batch of your moves.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23120d2b'/%3E%3Ccircle cx='11' cy='16' r='6' fill='none' stroke='%23ffc24b' stroke-width='2.5' stroke-dasharray='3 2'/%3E%3Ccircle cx='21' cy='16' r='6' fill='%234fe3ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 20V4M5 11l7-7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.5l1.3-6.6L2.5 9.3l6.6-.8z" stroke-linejoin="round"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></g></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5"/></g></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="currentColor"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 00-4 12.7V16h8v-1.3A7 7 0 0012 2z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-hop" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c2-9 12-12 16-6"/><path d="M20 6v6h-6"/></g></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><g fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></g></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.6"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></g></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></g></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></g></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 .5c0 1.8-2.5 2-2.5 4M12 17h.01"/></g></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></g></symbol>
  </defs>
</svg>

<!-- TITLE -->
<section id="title" class="screen" hidden>
  <div class="floaters" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="title-wrap">
    <div class="trail-dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <h1 class="logo">AFTERMOTION<span class="ghost g3" aria-hidden="true">AFTERMOTION</span><span class="ghost g2" aria-hidden="true">AFTERMOTION</span><span class="ghost g1" aria-hidden="true">AFTERMOTION</span></h1>
    <p class="tagline">Every move echoes. Only the first one counts.</p>
    <button id="tContinue" class="cta"><svg><use href="#i-play"/></svg><span id="tContinueLabel">Play</span></button>
    <div class="menu-grid">
      <button class="mbtn" data-go="map"><span class="mi" style="background:#4fe3ff"><svg><use href="#i-map"/></svg></span>Levels<small id="tStars"></small></button>
      <button class="mbtn" data-go="echoes"><span class="mi ring-ico"></span>Echoes<small id="tEchoes"></small></button>
      <button class="mbtn" data-open="help"><span class="mi" style="background:#ff5c8a"><svg><use href="#i-help"/></svg></span>How to play</button>
      <button class="mbtn" data-open="settings"><span class="mi" style="background:#2c2266"><svg><use href="#i-gear"/></svg></span>Settings</button>
    </div>
  </div>
  <div class="title-foot">
    <div class="pills"><span class="pill"><i class="coin-ico"></i><b class="coinCount">0</b></span><span class="pill"><svg class="star-ico"><use href="#i-star"/></svg><b id="tStarCount">0</b></span></div>
    <span class="dim small">World 1 of 20 · more worlds coming</span>
  </div>
</section>

<!-- MAP -->
<section id="map" class="screen" hidden>
  <header class="bar">
    <button class="icon-btn" data-go="title" aria-label="Home"><svg><use href="#i-back"/></svg></button>
    <div class="bar-title"><small>WORLD 1 · LEVELS 1–10</small><b class="disp">First Light</b></div>
    <span class="pill"><i class="coin-ico"></i><b class="coinCount">0</b></span>
  </header>
  <div class="map-body">
    <div class="map-area" id="mapArea">
      <svg class="map-path" viewBox="0 0 1000 620" preserveAspectRatio="none" aria-hidden="true"><path id="mapPathAll"/><path id="mapPathDone"/></svg>
      <div id="mapNodes"></div>
    </div>
    <aside class="card map-info" id="mapInfo"></aside>
  </div>
</section>

<!-- ECHOES -->
<section id="echoes" class="screen" hidden>
  <header class="bar">
    <button class="icon-btn" data-go="title" aria-label="Home"><svg><use href="#i-back"/></svg></button>
    <div class="bar-title"><small id="eCount"></small><b class="disp">Echoes</b></div>
    <span class="pill"><i class="coin-ico"></i><b class="coinCount">0</b></span>
  </header>
  <div class="echo-body">
    <div class="echo-grid" id="echoGrid"></div>
    <aside class="card echo-detail" id="echoDetail"></aside>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen" hidden>
  <header class="bar game-bar">
    <button class="icon-btn" id="btnPause" aria-label="Pause (Esc)"><svg><use href="#i-pause"/></svg></button>
    <div class="bar-title"><small id="gWorld"></small><b class="disp" id="gName"></b></div>
    <div class="star-meter">
      <div class="stars" id="gStars"></div>
      <div class="par-bar"><i id="gParFill"></i></div>
      <small id="gStarHint"></small>
    </div>
    <span class="pill" id="coinPill"><i class="coin-ico"></i><b class="coinCount">0</b></span>
  </header>
  <div class="game-body">
    <div class="play-col">
      <div class="stage" id="stage">
        <div class="board-frame" id="frame">
          <div class="board" id="board"></div>
          <div class="tip" id="tip" hidden></div>
          <div class="stuck" id="stuck" role="alert" hidden>
            <b>No way to win from here.</b><span>Every possible line has been checked.</span>
            <div><button class="btn" id="stuckUndo"><svg><use href="#i-undo"/></svg>Undo</button><button class="btn gold" id="stuckRestart"><svg><use href="#i-restart"/></svg>Restart</button></div>
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="btnUndo" title="Undo (Z)"><svg><use href="#i-undo"/></svg><span>Undo</span></button>
        <button class="btn" id="btnRestart" title="Restart (R)"><svg><use href="#i-restart"/></svg><span>Restart</span></button>
        <button class="btn favour" id="btnFavour" title="Favour (F)"><span class="luck-ring"><svg><use href="#i-bolt"/></svg></span><span>Favour</span></button>
        <button class="btn" id="btnHop" title="Hop (H)"><svg><use href="#i-hop"/></svg><span>Hop</span></button>
        <button class="btn" id="btnOracle" title="Oracle (O)" aria-pressed="false"><svg><use href="#i-eye"/></svg><span>Oracle</span></button>
        <button class="btn" id="btnHint" title="Hint"><svg><use href="#i-bulb"/></svg><span id="hintLabel">Hint</span></button>
      </div>
    </div>
    <aside class="side">
      <div id="echoCards"></div>
      <div class="card" id="oracleCard" hidden><h3>Oracle · next move</h3><div id="oracleList"></div></div>
      <div class="card goals"><h3>Goals</h3><div id="goals"></div></div>
      <div class="card moves-card">
        <div><h3>Moves</h3><div class="disp moves"><span id="gMoves">0</span><small id="gMovesOf"></small></div></div>
        <div class="dpad" aria-label="Move">
          <button data-dir="UP" aria-label="Up"><svg><use href="#i-arrow"/></svg></button>
          <button data-dir="LEFT" aria-label="Left"><svg style="transform:rotate(-90deg)"><use href="#i-arrow"/></svg></button>
          <button data-dir="DOWN" aria-label="Down"><svg style="transform:rotate(180deg)"><use href="#i-arrow"/></svg></button>
          <button data-dir="RIGHT" aria-label="Right"><svg style="transform:rotate(90deg)"><use href="#i-arrow"/></svg></button>
        </div>
      </div>
      <div class="card feed"><h3>Echo feed</h3><ol id="feed" aria-live="polite"></ol></div>
    </aside>
  </div>
</section>

<div id="overlay" class="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div id="fx" class="fx-layer" aria-hidden="true"></div>

<script src="js/engine.js"></script>
<script src="js/levels.js"></script>
<script src="js/progress.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
</body>
</html>
